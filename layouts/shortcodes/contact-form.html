<style>
  .contact-form {
    max-width: 600px;
    margin: 2rem auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    font-size: 1rem;
  }

  .contact-form label {
    font-weight: bold;
  }

  .contact-form input,
  .contact-form textarea {
    padding: 0.6rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    font: inherit;
  }

  .contact-form button {
    background-color: #007acc;
    color: white;
    border: none;
    padding: 0.8rem;
    border-radius: 6px;
    cursor: pointer;
  }

  .contact-form button:hover {
    background-color: #005f99;
  }
</style>

<form action="https://contact.hausos.xyz/send" method="POST" class="contact-form">
    <label for="name">お名前</label>
    <input type="text" id="name" name="name" required>
  
    <label for="email">メールアドレス</label>
    <input type="email" id="email" name="email" required>
  
    <label for="message">お問い合わせ内容</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <div>
※ メールアドレスの記入は任意です。<br>
ご連絡が必要な方は、返信可能なアドレスをご記入ください。<br>
記入がない場合は折り返しのご連絡はできませんので、ご了承ください。<br>
    </div>

    <!-- spam対策 honeypot -->
    <div style="display:none;">
      <label for="website">あなたのウェブサイト（空欄にしておいてください）</label>
      <input type="text" name="website" id="website">
    </div>
  
    <button type="submit">送信</button>
  </form>
